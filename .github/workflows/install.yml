name: Verify installation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g pnpm@12.6.0
      - run: node tests/install-smoke.mjs
      - name: Shell installer
        if: runner.os != 'Windows'
        shell: bash
        env:
          MOAH_INSTALL_DIR: ${{ runner.temp }}/moah-shell
          MOAH_NO_PATH_UPDATE: '1'
        run: |
          sh -n install.sh
          sh install.sh
          mkdir "$RUNNER_TEMP/shell-project"
          cd "$RUNNER_TEMP/shell-project"
          "$MOAH_INSTALL_DIR/bin/moah" init
          "$MOAH_INSTALL_DIR/bin/moah" pi --help
          # Verify persistent PATH quoting and repeated installation in a disposable home.
          export HOME="$RUNNER_TEMP/moah home"
          mkdir -p "$HOME"
          export SHELL=/bin/bash
          export MOAH_NO_PATH_UPDATE=0
          cd "$GITHUB_WORKSPACE"
          sh install.sh
          sh install.sh
          test "$(grep -c '^export PATH=' "$HOME/.profile")" = 1
          test "$(grep -c '^export PATH=' "$HOME/.bashrc")" = 1
          sh -c '. "$HOME/.profile"; moah about'
      - name: PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MOAH_INSTALL_DIR: ${{ runner.temp }}\moah-powershell
          MOAH_NO_PATH_UPDATE: '1'
        run: |
          ./install.ps1
          New-Item -ItemType Directory "$env:RUNNER_TEMP\powershell-project" | Out-Null
          Set-Location "$env:RUNNER_TEMP\powershell-project"
          & "$env:MOAH_INSTALL_DIR\moah.cmd" init
          & "$env:MOAH_INSTALL_DIR\moah.cmd" pi --help
          Set-Location "$env:GITHUB_WORKSPACE"
          $savedPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            $env:MOAH_NO_PATH_UPDATE = '0'
            powershell.exe -NoProfile -NonInteractive -Command "& './install.ps1'"
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 installer failed' }
            ./install.ps1
            $entries = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
            if (@($entries | Where-Object { $_ -eq $env:MOAH_INSTALL_DIR }).Count -ne 1) { throw 'PATH entry missing or duplicated' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $savedPath, 'User')
          }
